name: helix_js
description: >
  The helix DNA engine compiled to WebAssembly — instantiates and
  verifies a project's DNA from TypeScript test runs.
version: 0.2.0
repository: https://github.com/tssuite/helix-js.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  helix: ^1.3.0

dev_dependencies:
  gg_console_colors: ^2.5.0
  lints: ^6.1.0
  test: ^1.31.2