name: gg_dna_js_bridge
description: >
  The gg_dna DNA engine compiled to WebAssembly — instantiates and
  verifies a project's DNA from TypeScript test runs.
version: 1.0.0
repository: https://github.com/tssuite/gg_dna-js-bridge.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  # Workspace path dependency. For release, switch to the hosted
  # package: gg_dna: ^5.0.0
  gg_dna:
    path: ../../ggsuite/gg_dna

dev_dependencies:
  gg_console_colors: ^2.1.5
  lints: ^6.1.0
  test: ^1.31.1
